AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CodeGuard AI serverless deployment

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 512
    Environment:
      Variables:
        APP_ENV: cloud
        AI_PROVIDER: mock
        AWS_DEPLOY_ENABLED: 'true'
        BEDROCK_ENABLED: 'false'
        REVIEWS_TABLE_NAME: !Ref ReviewsTable
        ALLOWED_ORIGINS: '["https://main.d72rx55ohyqrt.amplifyapp.com"]'

Resources:

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

  ReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: app.main.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: review_id
          AttributeType: S
      KeySchema:
        - AttributeName: review_id
          KeyType: HASH

Outputs:

  ApiUrl:
    Description: CodeGuard API Gateway URL
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'

  ReviewsTableName:
    Description: DynamoDB reviews table
    Value: !Ref ReviewsTable